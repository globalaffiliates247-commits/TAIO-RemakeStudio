version: '3.8'

services:
  taio-remakestudio:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: taio-remakestudio
    ports:
      - "8000:10000"
    environment:
      - PORT=10000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    volumes:
      - ../data:/app/data
    restart: unless-stopped
