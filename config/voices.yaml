# TAIO RemakeStudio: Danh mục giọng đọc vùng miền và quốc tế
# Engines: edge_tts, vieneu, voxcpm, fpt_ai, omnivoice
# Chứa mô tả prompt giọng vùng miền cho VoxCPM2

voices:
  # Giọng Việt Bắc
  vi_north_female_1:
    id: "vi_north_female_1"
    name: "Hoài My (Bắc - Nữ thanh lịch)"
    region: "Bắc"
    gender: "female"
    engine: "edge_tts"
    voice_key: "vi-VN-HoaiMyNeural"
    voxcpm_prompt: "Giọng nữ Hà Nội chuẩn, thanh lịch, nhẹ nhàng, truyền cảm và tự nhiên."
    tags: ["tin_tuc", "ke_chuyen", "tu_nhien"]

  vi_north_male_1:
    id: "vi_north_male_1"
    name: "Nam Minh (Bắc - Nam trầm ấm)"
    region: "Bắc"
    gender: "male"
    engine: "edge_tts"
    voice_key: "vi-VN-NamMinhNeural"
    voxcpm_prompt: "Giọng nam miền Bắc trầm ấm, dõng dạc, tự tin, phong thái chuyên nghiệp."
    tags: ["thuyet_minh", "khoa_hoc", "review"]

  # Giọng Việt Nam
  vi_south_female_1:
    id: "vi_south_female_1"
    name: "Mỹ Linh (Nam - Nữ ngọt ngào)"
    region: "Nam"
    gender: "female"
    engine: "vieneu"
    voice_key: "vieneu_south_female_01"
    voxcpm_prompt: "Giọng nữ Sài Gòn ngọt ngào, tự nhiên, gần gũi, tươi vui và duyên dáng."
    tags: ["tiktok", "tinh_cam", "gan_gui"]

  vi_south_male_1:
    id: "vi_south_male_1"
    name: "Quốc Tuấn (Nam - Nam năng động)"
    region: "Nam"
    gender: "male"
    engine: "vieneu"
    voice_key: "vieneu_south_male_01"
    voxcpm_prompt: "Giọng nam miền Nam hào sảng, năng động, rõ lời và thân thiện."
    tags: ["vlog", "cong_nghe", "hai_huoc"]

  # Giọng Việt Trung (Miền Trung)
  vi_central_female_1:
    id: "vi_central_female_1"
    name: "Hương Giang (Trung - Huế dịu dàng)"
    region: "Trung"
    gender: "female"
    engine: "vieneu"
    voice_key: "vieneu_central_female_01"
    voxcpm_prompt: "Giọng nữ miền Trung (Huế) dịu dàng, êm đềm, ngọt bùi, đậm chất truyền thống."
    tags: ["que_huong", "tho", "truyen_thong"]

  # Giọng Quốc tế (OmniVoice / VoxCPM - Super Admin)
  en_us_female:
    id: "en_us_female"
    name: "Jenny (US English)"
    region: "US"
    gender: "female"
    engine: "omnivoice"
    voice_key: "en-US-JennyNeural"
    voxcpm_prompt: "Clear and expressive American English female voice, natural broadcast quality."
    tags: ["international"]

  zh_cn_female:
    id: "zh_cn_female"
    name: "Xiaoxiao (Mandarin)"
    region: "CN"
    gender: "female"
    engine: "omnivoice"
    voice_key: "zh-CN-XiaoxiaoNeural"
    voxcpm_prompt: "Standard Mandarin Chinese female voice, clear articulation and melodic tone."
    tags: ["international"]
